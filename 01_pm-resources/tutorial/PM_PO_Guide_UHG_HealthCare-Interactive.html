<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PM/PO Interview-Ready Guide</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1a1a1a;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#c7d2e0;border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;transition:width .25s;overflow:hidden}
.sidebar.open{width:220px}.sidebar.closed{width:56px}
.sidebar-header{display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px solid #f1f5f9;min-height:58px}
.sidebar-logo{min-width:30px;height:30px;border-radius:8px;background:#002677;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.sidebar-title{font-size:11px;font-weight:700;color:#002677;line-height:1.3;white-space:nowrap;overflow:hidden}
.sidebar-sub{font-size:10px;color:#94a3b8}
.toggle-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:13px;padding:4px;border-radius:6px;flex-shrink:0}
.toggle-btn:hover{background:#f1f5f9}
.nav{flex:1;overflow-y:auto;padding:8px 6px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 8px;border:none;background:none;cursor:pointer;border-radius:10px;transition:all .15s;text-align:left;color:#64748b}
.nav-btn:hover{background:#f1f5f9;color:#002677}
.nav-btn.active{background:#002677;color:#fff}
.nav-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center}
.nav-label{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.sidebar-footer{padding:10px 12px;border-top:1px solid #f1f5f9;font-size:10px;color:#94a3b8;text-align:center}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-icon{font-size:20px}
.topbar-title{font-size:13px;font-weight:700;color:#002677}
.topbar-sub{font-size:10px;color:#94a3b8}
.dot-nav{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;font-size:9px;font-weight:700;background:#e2e8f0;color:#64748b;transition:all .15s}
.dot:hover{background:#c7d2e0}
.dot.active{background:#002677;color:#fff}
.content{flex:1;overflow-y:auto;padding:20px}
.content-inner{max-width:860px;margin:0 auto}

/* Cards */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-header{padding:10px 16px;font-size:12px;font-weight:700;color:#fff}
.card-body{padding:14px 16px;font-size:12.5px;color:#374151;line-height:1.6}
.callout{border-left:4px solid #3b82f6;background:#eff6ff;color:#1e3a5f;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:12px;line-height:1.5}
.callout.green{border-color:#22c55e;background:#f0fdf4;color:#14532d}
.callout.yellow{border-color:#f59e0b;background:#fffbeb;color:#78350f}
.callout.orange{border-color:#f97316;background:#fff7ed;color:#7c2d12}

/* Tables */
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:11.5px}
.tbl th{background:#002677;color:#fff;text-align:left;padding:7px 10px;font-size:11px}
.tbl td{border-bottom:1px solid #f1f5f9;padding:6px 10px;color:#374151;vertical-align:top}
.tbl tr:nth-child(even) td{background:#f8fafc}

/* Tags */
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin:2px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#dcfce7;color:#15803d}
.tag-purple{background:#ede9fe;color:#6d28d9}
.tag-orange{background:#ffedd5;color:#c2410c}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}

/* Accordion */
.accordion-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border:none;background:none;cursor:pointer;text-align:left;transition:background .15s}
.accordion-btn:hover{background:#eff6ff}
.accordion-circle{width:26px;height:26px;border-radius:50%;background:#002677;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.accordion-title{font-size:12.5px;font-weight:600;color:#1e293b;flex:1}
.accordion-arrow{color:#94a3b8;font-size:12px}
.accordion-body{padding:12px 16px;background:#f0fdf4;border-top:1px solid #dcfce7}
.accordion-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.accordion-sub-title{font-size:10px;font-weight:700;color:#15803d;margin-bottom:4px}
.accordion-text{font-size:11px;color:#374151;line-height:1.5}

/* Mock Qs */
.q-card{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.q-btn{width:100%;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:none;background:#fff;cursor:pointer;text-align:left;transition:background .15s}
.q-btn:hover{background:#eff6ff}
.q-num{width:24px;height:24px;border-radius:50%;background:#002677;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.q-text{font-size:12.5px;font-weight:500;color:#1e293b;flex:1;line-height:1.4}
.q-arrow{color:#94a3b8;font-size:12px;flex-shrink:0}
.q-answer{padding:12px 14px;background:#f0fdf4;border-top:1px solid #dcfce7;font-size:12px;color:#374151;line-height:1.6}
.q-answer-label{font-size:10px;font-weight:700;color:#15803d;margin-bottom:6px}

/* Checklist */
.check-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:6px;background:#fff}
.check-item:hover{background:#eff6ff}
.check-item.done{background:#f0fdf4;border-color:#bbf7d0}
.check-item input{width:16px;height:16px;flex-shrink:0;margin-top:1px;accent-color:#002677;cursor:pointer}
.check-label{font-size:12.5px;color:#374151;line-height:1.4}
.check-label.done{text-decoration:line-through;color:#94a3b8}
.progress-bar-bg{background:#e2e8f0;border-radius:20px;height:10px;margin:10px 0}
.progress-bar{height:10px;border-radius:20px;transition:width .4s,background .4s}
.filter-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:#f1f5f9;color:#64748b;transition:all .15s}
.filter-btn:hover{background:#e2e8f0}
.filter-btn.active{background:#002677;color:#fff}

/* Bottom nav */
.bottom-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0}
.btn-prev{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;font-size:12px;color:#64748b;transition:all .15s}
.btn-prev:hover{border-color:#002677;color:#002677}
.btn-next{display:flex;align-items:center;gap:6px;padding:8px 18px;border:none;border-radius:10px;background:#002677;color:#fff;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.btn-next:hover{background:#0a3d91}

/* Mono block */
.mono{background:#1e293b;color:#86efac;padding:12px 14px;border-radius:8px;font-family:monospace;font-size:11px;line-height:1.5;margin:10px 0;white-space:pre;overflow-x:auto}

/* Timeline */
.timeline-item{display:flex;gap:12px;margin-bottom:14px}
.timeline-date{min-width:88px;font-size:10px;font-weight:700;color:#002677;padding-top:2px}
.timeline-line{border-left:2px solid #bfdbfe;padding-left:12px;flex:1}
.timeline-role{font-size:12.5px;font-weight:600;color:#1e293b}
.timeline-detail{font-size:11px;color:#64748b}

/* Swot */
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot-cell{border-radius:10px;padding:12px;border:1px solid}
.swot-s{background:#f0fdf4;border-color:#bbf7d0}.swot-w{background:#fff7ed;border-color:#fed7aa}
.swot-o{background:#eff6ff;border-color:#bfdbfe}.swot-t{background:#fef2f2;border-color:#fecaca}
.swot-label{font-size:10px;font-weight:700;margin-bottom:6px}
.swot-item{font-size:11px;color:#374151;margin-bottom:2px}

/* NS (North Star) */
.ns-box{background:#002677;color:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px}
.ns-label{font-size:10px;color:#93c5fd;margin-bottom:4px}
.ns-metric{font-size:16px;font-weight:800}
.ns-sub{font-size:10px;color:#93c5fd;margin-top:4px}

/* Section title */
.section-title{font-size:22px;font-weight:800;color:#002677;margin-bottom:2px}
.section-sub{font-size:12px;color:#94a3b8;margin-bottom:18px}

/* Value loop */
.vloop{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:#eff6ff;border-radius:10px;margin:10px 0;flex-wrap:wrap}
.vloop-node{background:#002677;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600}
.vloop-arrow{color:#002677;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const SECTIONS = [
  { id:"intro",     label:"Introduction",           icon:"👋", short:"0" },
  { id:"journey",   label:"My Journey",             icon:"🧭", short:"1" },
  { id:"frameworks",label:"PM Frameworks",           icon:"🧰", short:"2" },
  { id:"safe",      label:"SAFe & Agile",            icon:"⚙️", short:"3" },
  { id:"poflow",    label:"PO E2E Flow",             icon:"🔄", short:"4" },
  { id:"companion", label:"Case Study: Companion",   icon:"🤖", short:"5" },
  { id:"quickbyte", label:"Case Study: QuickByte",   icon:"🍔", short:"6" },
  { id:"domain",    label:"UHG/UHC Domain Knowledge", icon:"🏥", short:"7" },
  { id:"glossary",  label:"Acronym Glossary",         icon:"📖", short:"8" },
  { id:"mock",      label:"Mock Interview",           icon:"🎯", short:"9"},
  { id:"checklist", label:"Prep Checklist",           icon:"✅", short:"10"},
];

const MOCK_QS = [
  {q:"Walk me through how you'd take a problem from discovery to production.",a:"Use the 14-step PO E2E flow: Business Problem Discovery → Requirement Workshops → AS-IS → TO-BE → Elaboration → Impact Analysis → Prioritization → Backlog Grooming → Estimation → Release Scope → Release Planning → Stakeholder Alignment → Pre-Release Readiness → Go-Live. Lead with the outcome you're achieving at each step, not just the activity."},
  {q:"You have 10 backlog items and capacity for 3. How do you decide?",a:"3-lens filter: (1) Critical risk/compliance/revenue impact? → prioritise immediately. (2) Highest customer + business impact? → RICE score. (3) Strategic enabler or tech debt? → WSJF at program level. Always communicate the trade-off on the 7 you didn't pick."},
  {q:"What have you learnt in 4 months that makes you ready to be a PM?",a:"Catalyst 3.0: 70+ hrs structured learning, 2 product case studies (Companion + QuickByte), SAFe POPM cert. Showcase score 64%, storytelling 3/5. I can now own discovery, prioritise a backlog with data, and defend decisions with KPIs."},
  {q:"One thing that makes you effective as a PM, and one that could derail you?",a:"Strength: Ownership mindset + technical depth — I spot edge cases early and build engineering trust. Weakness I'm fixing: market discovery skills. I now do JTBD interviews, use empathy maps before any user story, and validate assumptions before committing scope."},
  {q:"Why are you ready for a craft change?",a:"My UHG journey: led end-to-end quality for Companion — defined scope, managed clinical edge cases, drove MVP in 2 months with zero production defects. I was already doing PM work (prioritisation, stakeholder alignment, acceptance criteria, go/no-go calls) without the title. Catalyst formalised the mindset."},
  {q:"That was your team's impact — what was YOUR individual impact?",a:"I owned end-to-end quality and acceptance criteria for Companion. Defined the validation strategy across clinical journeys + edge cases, embedded automated quality gates in CI/CD (25% release risk reduction), and drove the go-live decision. Intent detection >91% and NPS >70 trace directly to my testing and feedback loops."},
  {q:"What would you do differently when you become a PM?",a:"Invest more in discovery before writing any acceptance criteria. Most expensive bugs are misunderstood requirements, not code bugs. I'd also establish a North Star metric with the team before the roadmap is set — not after the first sprint."},
  {q:"A VP gives you a feature request; backlog data says it's low priority. What do you do?",a:"Don't say yes, don't say no. Say: 'Let me show you what we'd deprioritise to fit this in, and what the data says about the trade-off.' Show RICE/WSJF scores, the opportunity cost, and let the VP make an informed call. That's PM leadership — transparent trade-off management."},
  {q:"Tell me about a product or feature that failed. What broke?",a:"Use STAR. Name the root cause (missed edge case, assumption not validated, stakeholder misalignment). Describe exactly what YOU did vs. what the team did. End with what you changed in your process. The learning is the answer — not the failure itself."},
  {q:"3 weeks from deadline. Engineering says scope must cut 40%. How?",a:"Run MoSCoW on remaining work immediately. Protect Must Haves tied to the PMF hypothesis. Demote Could Haves. Communicate to stakeholders with a trade-off table: here's what ships, here's what moves to NEXT, here's the impact. Surface it fast — don't absorb the decision alone."},
  {q:"Given product ownership tomorrow — first thing in week one?",a:"Week 1: stakeholder map, AS-IS analysis, listen to 5 real users, understand the North Star metric and current KPIs. Wouldn't do: write a roadmap. A roadmap without a validated problem statement is fiction."},
  {q:"How do you define success for a feature before it ships?",a:"Define the KR before any code is written. 'Feature shipped' is not success. Success = '40% of HDHP members check their deductible tracker monthly within 60 days.' If you can't define the measurable outcome upfront, you're not ready to build it."},
  {q:"Difference between a problem worth solving and one that just feels urgent?",a:"Worth solving = ties to the North Star, validated by data (RICE Reach + Impact both high), affects a real segment. Urgent = loud, one stakeholder's squeaky wheel. Apply: 'If we solve this, which KR moves?' If unclear — it's urgency, not value."},
  {q:"As an engineer, someone told you what to build. As a PM, nobody will. How?",a:"Discovery + data + customer empathy + strategic alignment. System Thinking: Problem → understand the system → Solution. Direction comes from the gap between current state (AS-IS) and desired outcome, validated by user research. ISIbS: Ignite → Shape → Incubate → Build → Scale."},
  {q:"Engineering background: advantage or problem?",a:"Advantage: scope realism, catching hidden complexity in estimates, tighter acceptance criteria, engineering trust. Problem: jumping to 'how to build it' before validating 'should we build it at all.' I consciously hold off on technical solutioning until the problem is fully framed."},
  {q:"You're the PM with no direct reports. How do you lead?",a:"Influence without authority. Clear priorities backed by data, transparent trade-offs, regular stakeholder alignment, psychological safety for the team to push back, and being the person who unblocks — not who bottlenecks. SAFe Alignment principle: everyone rowing in the same direction doesn't require a hierarchy."},
  {q:"Take a product you used in the last 24 hours. One thing it should stop doing.",a:"Structure: Name the product → identify friction (JTBD) → state what creates the friction → what stopping it enables. E.g., Teams should stop nesting reply threads inconsistently — it forces users to hunt for context in long channels, breaking the 'get caught up quickly' job."},
  {q:"Suggest 3 improvements to Microsoft Teams.",a:"(1) Smart meeting summaries auto-pinned to channel — job: catch up without watching the recording. (2) Unified search across chats + channels + files. (3) Intent-based notification filtering — only surface messages requiring action. Metric each one: task completion rate, time-to-find, notification-to-action ratio."},
  {q:"How do you work with actuarial on benefit design?",a:"Bring member/provider research + competitive benchmarking. They bring claims data models. Agree on success metric upfront: PMPM reduction, retention, or Stars improvement. If cost doesn't pencil out, revisit scope — not push harder. Best designs come from member empathy + actuarial rigour together."},
  {q:"Walk me through how a claim gets processed end to end.",a:"Provider submits via EDI 837 → clearinghouse (Change Healthcare) routes → UHC adjudication checks eligibility, network status, prior auth, benefit rules → if approved: EOB generated, provider paid via EDI 835, member billed balance → if denied: denial code sent, appeal rights communicated. Your cost estimator, deductible tracker, and prior auth status features all sit on top of this flow."},
];

const CHECKLIST = [
  {id:"c1",text:"Rehearse SWOT + Journey as a 90-second spoken narrative"},
  {id:"c2",text:"Companion numbers cold: $57M cost · 50% no-escalation · $5M/$30M savings · 91% intent accuracy"},
  {id:"c3",text:"QuickByte numbers cold: £17B TAM · £5-7B SAM · 22 vs 11/15 strategic score"},
  {id:"c4",text:"EPIC → Feature → User Story hierarchy — draw from memory"},
  {id:"c5",text:"WSJF, RICE, MoSCoW — explain each with a worked example in <60 seconds"},
  {id:"c6",text:"HIPAA 3 rules + PO 14-step flow — sketch from memory"},
  {id:"c7",text:"Practised Q4, Q8, Q11, Q17 out loud (hardest behavioural/judgment Qs)"},
  {id:"c8",text:"Prepared 2–3 questions to ask the interviewer"},
  {id:"c9",text:"SAFe: ABTP values, ART structure, WSJF formula — can recite cold"},
  {id:"c10",text:"UHG stat ready: $400.3B revenue · 146M individuals · Optum growing 2× faster than UHC"},
];

// ── Small helpers ──────────────────────────────────────────────────
function Card({title, accent="#002677", children}){
  return <div className="card">
    {title && <div className="card-header" style={{background:accent}}>{title}</div>}
    <div className="card-body">{children}</div>
  </div>;
}
function Tbl({headers,rows}){
  return <table className="tbl">
    <thead><tr>{headers.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
    <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody>
  </table>;
}
function BottomNav({active, setActive}){
  const idx = SECTIONS.findIndex(s=>s.id===active);
  return <div className="bottom-nav">
    {idx>0
      ? <button className="btn-prev" onClick={()=>setActive(SECTIONS[idx-1].id)}>← {SECTIONS[idx-1].label}</button>
      : <div/>}
    {idx<SECTIONS.length-1
      ? <button className="btn-next" onClick={()=>setActive(SECTIONS[idx+1].id)}>{SECTIONS[idx+1].label} →</button>
      : <div className="btn-next" style={{background:"#1f9d55"}}>🎉 All done!</div>}
  </div>;
}

// ── SECTIONS ──────────────────────────────────────────────────────
function Intro(){
  return <div>
    <div className="section-title">Introduction</div>
    <div className="section-sub">Opening self-introduction — rehearse this as a spoken narrative</div>

    <Card title="👋 Spoken Introduction" accent="#002677">
      <p style={{marginBottom:10}}>Good morning, everyone. This is Arunava. I bring around thirteen years of industry experience across HealthCare, Retail, and Banking, with the last two years focused specifically on product management.</p>
      <p style={{marginBottom:10}}>In my most recent role at UHG, I led an GenAI-based chatbot product aimed at improving the customer experience while cutting operational costs — costs that were running into the hundreds of thousands of dollars annually. Over three months, we took NPS from near zero to about 85%, which was a big win for the team and a strong signal that the product was solving a real problem.</p>
      <p style={{marginBottom:10}}>Alongside that, I've continued investing in my own growth — last year I completed SAFe PO/PM certification, including a six-month training program from PS on Product Management.</p>
      <p>Right now, I'm looking to bring that mix of domain experience and hands-on product leadership into my next assignment.</p>
    </Card>

    <Card title="🔑 Key Beats to Hit" accent="#1f9d55">
      <div className="grid2">
        <div className="callout">🕐 <b>13 years</b> across HealthCare, Retail, Banking — last 2 years in product management</div>
        <div className="callout green">🤖 <b>GenAI chatbot @ UHG</b> — cut operational costs (100Ks/yr), boosted CX</div>
        <div className="callout yellow">📈 <b>NPS: ~0 → ~85%</b> in 3 months</div>
        <div className="callout orange">🎓 <b>SAFe PO/PM certified</b> + 6-month PS Product Management program</div>
      </div>
      <div className="callout" style={{marginTop:10}}>💬 <b>Interview tip:</b> Keep this to 45–60 seconds. Lead with breadth (13 yrs, 3 domains), pivot to depth (UHG GenAI win with a number), close with momentum (certifications + what you're looking for next). Let the interviewer's follow-up questions pull out the detail — don't front-load everything.</div>
    </Card>
  </div>;
}

function Journey(){
  return <div>
    <div className="section-title">My Product Journey</div>
    <div className="section-sub">Your personal narrative — told in the right order</div>

    <Card title="📅 Career Timeline" accent="#002677">
      <div className="timeline-item"><div className="timeline-date">May 2024</div><div className="timeline-line"><div className="timeline-role">UHC — QE Lead</div><div className="timeline-detail">Led validation automation for web-based claim system</div></div></div>
      <div className="timeline-item"><div className="timeline-date">Dec 2024</div><div className="timeline-line"><div className="timeline-role">Optum UHG — QE Lead</div><div className="timeline-detail">Led QE for AI-enabled Health Chat (Companion) MVP → Go-Live</div></div></div>
      <div className="timeline-item"><div className="timeline-date">Sep 2025</div><div className="timeline-line"><div className="timeline-role">PS Catalyst Program</div><div className="timeline-detail">Structured product mindset + strategic decision capability</div></div></div>
      <div className="timeline-item"><div className="timeline-date">Dec 2025</div><div className="timeline-line"><div className="timeline-role">SAFe 6.0 PO/PM Certification</div><div className="timeline-detail">Completed Product Management Certification</div></div></div>
    </Card>

    <Card title="💡 Personal SWOT" accent="#0a3d91">
      <div className="swot-grid">
        <div className="swot-cell swot-s"><div className="swot-label" style={{color:"#15803d"}}>💪 Strengths</div>{"Ownership mindset · Customer empathy · Analytical thinking · Technical skills".split(" · ").map((s,i)=><div key={i} className="swot-item">• {s}</div>)}</div>
        <div className="swot-cell swot-w"><div className="swot-label" style={{color:"#c2410c"}}>⚠️ Weaknesses</div>{"Executive presentations · Feature prioritisation depth · Market discovery skills (building)".split(" · ").map((s,i)=><div key={i} className="swot-item">• {s}</div>)}</div>

      <Tbl headers={["Framework","Formula","Best Used For"]} rows={[

        ["RICE","(Reach × Impact × Confidence) ÷ Effort","Data-driven story/epic/feature scoring"],
        ["Value vs. Effort (2×2)","High/Low Value × High/Low Effort grid","Quick wins vs big bets vs avoid"],
        ["WSJF","Cost of Delay ÷ Job Size","SAFe/Portfolio-level; Cost of Delay = Business Value + Time Criticality + Risk Reduction"],
      ]}/>
      <div className="callout yellow">🎯 <b>3-Lens Prioritization Checklist:</b> (1) Critical risk/compliance/revenue? → immediate. (2) Highest customer + business impact? → RICE. (3) Strategic enabler or tech debt? → WSJF.</div>
    </Card>

    <Card title="🧮 Worked Example — How Each Score Is Actually Calculated" accent="#0a3d91">
      <Tbl headers={["Framework","Scale Used","Worked Example"]} rows={[
        ["RICE","Reach = # users/quarter (raw number) · Impact = 0.25 / 0.5 / 1 / 2 / 3 (minimal→massive) · Confidence = 50% / 80% / 100% · Effort = person-months","Feature reaches 5,000 users/qtr, Impact=2 (high), Confidence=80%, Effort=4 person-months → RICE = (5000 × 2 × 0.8) ÷ 4 = 2,000. Compare this score against other backlog items — higher wins."],
        ["WSJF","Business Value, Time Criticality, Risk/Opportunity Enablement each scored 1–20 on a Fibonacci-like relative scale (1,2,3,5,8,13,20) · Job Size same 1–20 scale","BV=8, TC=5, RR/OE=3 → Cost of Delay = 16. Job Size=8 → WSJF = 16 ÷ 8 = 2.0. Rank all backlog items by WSJF descending — highest Cost of Delay per unit of size ships first."],
        ["Value vs. Effort (2×2)","Value scored 1–10 · Effort scored 1–10 (team's relative gut-check, not absolute units)","Value=8, Effort=3 → plots top-left = 'Quick Win' quadrant → prioritise immediately. Value=8, Effort=9 → 'Big Bet' quadrant → needs roadmap discussion, not this sprint."],
        ["MoSCoW","No numeric scale — categorical buckets only (Must / Should / Could / Won't)","Of 12 backlog items: 5 tagged Must (ships no matter what), 4 Should (ships if capacity allows), 2 Could (nice-to-have, first to cut), 1 Won't (explicitly out of scope this release)."],
      ]}/>
      <div className="callout">💡 <b>Interview tip:</b> Don't just recite the formula — walk through one worked example out loud with real-looking numbers. Interviewers are testing whether you've actually used the framework, not memorised it.</div>
    </Card>

    <Card title="🎯 OKR Anti-Patterns" accent="#7c3aed">
      <Tbl headers={["Anti-Pattern ❌","Correct Version ✅"]} rows={[
        ["'Launch Feature X by Q2' (output)","'50% of users adopt Feature X monthly by Q2' (outcome)"],
        ["'Achieve compliance' (table stakes)","Compliance lives in Definition of Done, not OKR"],
        ["'Reach 5M app downloads' (vanity)","'3.2M MAU completing ≥1 self-service transaction'"],
      ]}/>
      <div style={{fontSize:12,color:"#374151",marginTop:8}}>North Star = single metric capturing core user value. All KRs feed it. E.g., QuickByte: <b>"Monthly Repeat Orders per Active User."</b></div>
    </Card>

    <Card title="📊 Metrics Glossary" accent="#374151">
      <Tbl headers={["Metric","Full Form","What It Measures","Calculation Example","Scale"]} rows={[
        ["NPS","Net Promoter Score","Likelihood to recommend (short-term signal)","% Promoters (score 9–10) − % Detractors (score 0–6), from a sample of 200 respondents → 55% Promoters − 15% Detractors = NPS of 40","-100 to +100"],
        ["CSAT","Customer Satisfaction Score","Satisfaction with a specific interaction","(# of 4–5 star ratings ÷ Total ratings) × 100 → 340 out of 400 rated 4–5 stars → CSAT = 85%","0–100%"],
        ["MAU","Monthly Active Users","Unique users active in a month","Count of unique user IDs with ≥1 session in the calendar month → 3.2M distinct users logged in during June","Raw count (no fixed cap)"],
        ["ROR","Repeat Order Rate","% users placing >1 order","(Users with ≥2 orders in period ÷ Total users who ordered) × 100 → 1,200 of 4,000 ordering users placed 2+ orders → ROR = 30%","0–100%"],
        ["AOV","Average Order Value","Average $ per order","Total revenue ÷ Total number of orders → $84,000 revenue ÷ 1,050 orders = $80 AOV","Raw $ value (business-specific range)"],
        ["ANO","Average Number of Orders (per user)","How frequently an average active user transacts in a period","Total orders in period ÷ Total active users in same period → 8,400 orders ÷ 2,100 MAU = 4.0 orders/user/month","Raw count — benchmark typically 0–10 orders/month depending on category"],
        ["Feature Adaptability","Feature Adaptability Rate","How well a feature performs consistently across different user segments, devices, or contexts (not just overall usage)","(# segments/device-types where feature success rate ≥ target threshold ÷ Total segments tested) × 100 → feature hit the 80%+ success bar on 5 of 6 tested segments (mobile, desktop, 4 age bands) → Feature Adaptability = 83%","0–100% (target is usually ≥80–85% to call a feature 'adaptable')"],
        ["TAM / SAM / SOM","Total / Serviceable / Obtainable Market","Market sizing layers","TAM = total market $ demand → SAM = % TAM your model can realistically reach (geo/segment/regulatory fit) → SOM = % SAM you can capture in 3 yrs given competition/capacity","Each expressed as $ value; SAM is typically 20–40% of TAM, SOM 5–15% of SAM as a rough sanity check"],
        ["PMPM","Per Member Per Month","Universal health insurance value unit","Total cost or revenue ÷ (Total members × Total months) → $12M total plan cost ÷ (100,000 members × 12 months) = $10 PMPM","Raw $ value (varies by plan type — $ tens to low hundreds)"],
      ]}/>
      <div className="callout">📐 <b>Interview tip:</b> When asked to define success, always state the metric AND the scale/threshold in the same breath — "Feature Adaptability above 80% across all device segments," not just "good feature adaptability." A metric without a target isn't a KR, it's a vibe.</div>
    </Card>
  </div>;
}

    {n:"4",title:"Future State Design (TO-BE)",goal:"Design improved business process",activities:"Collaborate with architects/UX/compliance · define automation points & exception handling",deliverable:"TO-BE process flow · Capability mapping · Functional boundaries"},

    {n:"7",title:"Prioritization",goal:"Decide what gets built first",activities:"Prioritise by business value, regulatory urgency, customer impact, revenue, risk (MoSCoW / WSJF / RICE)",deliverable:"Prioritised backlog · Trade-off documentation"},
    {n:"8",title:"Backlog Refinement / Grooming",goal:"Prepare stories for development readiness",activities:"Clarify requirements · resolve ambiguities · add missing acceptance criteria · identify technical spikes",deliverable:"Sprint-ready stories · Acceptance criteria · Spikes identified"},
    {n:"9",title:"Estimation & Feasibility",goal:"Understand delivery effort & technical reality",activities:"Attend estimation sessions · clarify business logic · negotiate scope · understand constraints",deliverable:"Story points · Feasibility notes · Revised scope"},

function Mock(){
  const [revealed, setRevealed] = useState({});
  const [filter, setFilter] = useState("all");
  const cats = {
    all: MOCK_QS,
    behavioral: MOCK_QS.slice(2,10),
    strategy: MOCK_QS.slice(10,16),
    domain: MOCK_QS.slice(16,20),
  };
  const qs = cats[filter];
  const allRev = qs.every((_,i)=>revealed[`${filter}-${i}`]);
  return <div>
    <div className="section-title">Mock Interview Question Bank</div>
    <div className="section-sub">Tap a question to reveal the answer approach</div>
    <div className="filter-btns">
      {[["all","All 20"],["behavioral","Behavioural"],["strategy","Strategy & Judgment"],["domain","Domain"]].map(([k,l])=>(
        <button key={k} className={`filter-btn${filter===k?" active":""}`} onClick={()=>{setFilter(k);setRevealed({})}}>{l}</button>
      ))}
      <button className="filter-btn" style={{marginLeft:"auto"}} onClick={()=>{
        if(allRev){setRevealed({});}
        else{const a={};qs.forEach((_,i)=>{a[`${filter}-${i}`]=true;});setRevealed(a);}
      }}>{allRev?"Hide All":"Reveal All"}</button>
    </div>
    <div>
      {qs.map((item,i)=>{
        const key=`${filter}-${i}`;
        const open=revealed[key];
        return <div key={key} className="q-card">
          <button className="q-btn" onClick={()=>setRevealed(r=>({...r,[key]:!r[key]}))}>
            <div className="q-num">{i+1}</div>
            <div className="q-text">{item.q}</div>
            <div className="q-arrow">{open?"▲":"▼"}</div>
          </button>
          {open&&<div className="q-answer"><div className="q-answer-label">💡 Answer Approach</div>{item.a}</div>}
        </div>;
      })}
    </div>
  </div>;
}

      {CHECKLIST.map(item=>(
        <label key={item.id} className={`check-item${checked[item.id]?" done":""}`}>
          <input type="checkbox" checked={!!checked[item.id]} onChange={()=>setChecked(c=>({...c,[item.id]:!c[item.id]}))}/>
          <span className={`check-label${checked[item.id]?" done":""}`}>{item.text}</span>
        </label>
      ))}
    </div>
    <Card title="🎯 3 Questions to Ask the Interviewer" accent="#374151">
      <ul style={{paddingLeft:16,fontSize:12.5,color:"#374151",lineHeight:2}}>
        <li>"How does the PM team here balance regulatory compliance timelines with innovation velocity?"</li>
        <li>"What does the first 90 days look like for a PM transitioning from a technical background?"</li>
        <li>"How does your team measure product success beyond delivery — what's the North Star metric for this product area?"</li>
      </ul>
    </Card>
  </div>;
}

  const filtered = terms.filter(t=>{
    const matchCat = cat==="all" || t.c===cat;
    const q = search.toLowerCase();
